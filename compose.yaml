name: dashingnoah

services:
  web:
    build:
      context: .
      target: web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-dashingnoah.top}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - backend
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: "3001"
      CATALOG_ONLY: "true"
      CLIENT_ORIGIN: https://${SITE_DOMAIN:-dashingnoah.top}
    read_only: true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/products').then(async r => process.exit(r.ok && Array.isArray((await r.json()).products) ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
